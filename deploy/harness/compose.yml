services:
  postgres:
    mem_limit: 2g
    cpus: 2
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./.multica/harness-deploy/backend
      dockerfile: Dockerfile
    ports: !reset []
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: deploy/harness/Dockerfile.web
      args:
        NEXT_PUBLIC_APP_VERSION: ${MULTICA_BUILD_VERSION:-harness-b115ec80f}
    ports: !reset []
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *logging

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "172.16.66.249:23000:8080"
      - "127.0.0.1:23000:8080"
    volumes:
      - ./deploy/harness/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
